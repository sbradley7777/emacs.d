##############################################################################
# Global Options
##############################################################################
# default_language_version:
#  python: python3.11
# exclude: "^demo_data|^dist|^docs|^venv"

# To update the version of the hooks to use and update 'pre-commit' configuration file then run.
#   $ pre-commit autoupdate
#
# The configuration options for hooks is in: pyproject.toml.


##############################################################################
# Hooks
##############################################################################
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        description: "Prevent giant files from being committed."
      - id: requirements-txt-fixer
        description: "Sorts entries in requirements.txt."
      - id: check-executables-have-shebangs
        description: "Ensures that (non-binary) executables have a shebang."
      - id: trailing-whitespace
        description: "Trims trailing whitespace."
      - id: end-of-file-fixer
        description: "Makes sure files end in a newline and only a newline"
      - id: detect-private-key
        description: "Checks for the existence of private keys."

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        description: "The utility shellcheck is a static analysis tool for shell scripts."
        args: ["--exclude=SC1091"]

  - repo: https://github.com/openstack-dev/bashate.git
    rev: 2.1.1
    hooks:
      - id: bashate
        description: "The utility bashate is an automated style checker for bash scripts "
        args: ["--ignore=E006"]

  - repo: https://github.com/codespell-project/codespell
    # To run 'codespell' manually and fix typos:
    #   $ ~/.cache/pre-commit/<cache dir>/py_env-python3.9/bin/codespell -w <path to file or files>
    rev: v2.4.1
    hooks:
      - id: codespell
        description: "Fix common misspellings in text files (including source code)."
        args: ["-f"]

  - repo: local
    hooks:
      - id: elisp-autofmt
        name: elisp-autofmt
        description: "Automatically format Emacs Lisp files using elisp-autofmt"
        entry: scripts/elisp-autofmt-hook
        language: script
        files: '\.el$'
        pass_filenames: true
        # To use a custom path to elisp-autofmt.py, uncomment and modify:
        # args: ["--bin", "/path/to/your/elisp-autofmt.py"]
        #
        # Default path: ~/github/elisp-autofmt/elisp-autofmt.py
        # Repository: https://github.com/emacsmirror/elisp-autofmt
